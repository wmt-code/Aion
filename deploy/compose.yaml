name: aion

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: aion
      POSTGRES_USER: aion
      POSTGRES_PASSWORD: ${AION_DATABASE_PASSWORD:?请设置 AION_DATABASE_PASSWORD}
    ports:
      - "127.0.0.1:${AION_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aion -d aion"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4.5-alpine
    ports:
      - "127.0.0.1:${AION_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: [app]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: aion:local
    stop_grace_period: 40s
    environment:
      SPRING_PROFILES_ACTIVE: api
      AION_DATABASE_URL: jdbc:postgresql://postgres:5432/aion
      AION_DATABASE_USERNAME: aion
      AION_DATABASE_PASSWORD: ${AION_DATABASE_PASSWORD:?请设置 AION_DATABASE_PASSWORD}
      AION_REDIS_HOST: redis
    ports:
      - "127.0.0.1:${AION_API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    profiles: [app]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: aion:local
    stop_grace_period: 40s
    environment:
      SPRING_PROFILES_ACTIVE: worker
      AION_DATABASE_URL: jdbc:postgresql://postgres:5432/aion
      AION_DATABASE_USERNAME: aion
      AION_DATABASE_PASSWORD: ${AION_DATABASE_PASSWORD:?请设置 AION_DATABASE_PASSWORD}
      AION_REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres-data:
